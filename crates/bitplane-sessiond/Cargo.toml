[package]
name = "bitplane-sessiond"
description = "The bitplane daemon: one per host, owning its sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
bitplane-protocol = { git = "https://github.com/bp-bitplane/bitplane-protocol", rev = "b44e121a1c2a4727d4099188daad6a2106e8081f" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
libghostty-vt = "=0.2.2"
portable-pty = "0.9"
rustix = { version = "1", features = ["fs", "process", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
